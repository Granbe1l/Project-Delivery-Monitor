# Deployment template only. Review provider terms and pricing before provisioning.
services:
  - type: web
    name: project-delivery-monitor-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    autoDeploy: false
    healthCheckPath: /health/ready
    dockerCommand: sh -c 'alembic upgrade head && python -m app.jobs.init_db && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SYNC_MAX_PAGES
        value: '2'
      - key: SYNC_REQUEST_BUDGET
        value: '35'
      - key: SYNC_STALE_HOURS
        value: '24'
