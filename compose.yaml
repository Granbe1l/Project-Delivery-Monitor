services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: pdm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdm_local_only}
      POSTGRES_DB: pdm
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pdm -d pdm']
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pdm:${POSTGRES_PASSWORD:-pdm_local_only}@db:5432/pdm
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    command: ['sh', '-c', 'alembic upgrade head && python -m app.jobs.init_db && uvicorn app.main:app --host 0.0.0.0 --port 8000']
volumes:
  postgres_data:
