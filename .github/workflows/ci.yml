name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: pdm
          POSTGRES_PASSWORD: pdm_local_only
          POSTGRES_DB: pdm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pdm -d pdm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pdm:pdm_local_only@localhost:5432/pdm_test
      TEST_DATABASE_URL: postgresql+psycopg://pdm:pdm_local_only@localhost:5432/pdm_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm test && npm run build
